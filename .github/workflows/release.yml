name: 🚀 Release

# Release is driven by a user-created GitHub Release. A manual dispatch is a
# dry run: it builds and tests, and every job that publishes anywhere is gated
# on the release event, so dispatching from a branch cannot reach TestPyPI or
# PyPI. (It could once -- the publish jobs had no event guard, and only the
# version-verify step failing on a non-tag ref kept PyPI out of reach.)
# Tag-push auto-release is deliberately not wired up yet — flip when ready.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # Delegate tests + build + (optional) GH release to the ci-tooling reusable.
  # GH release creation is suppressed because `release: published` means one already exists.
  # Pinned to a commit, not a tag: a tag can be moved, and a reusable workflow
  # runs with this repository's token. python-release.yml declares no secrets
  # (GITHUB_TOKEN is implicit), so nothing is inherited.
  release:
    uses: provide-io/ci-tooling/.github/workflows/python-release.yml@e593b16e043a725c3234e0e6b9e5a2a29829c071  # v0.4.2
    permissions:
      contents: write
    with:
      create-github-release: false

  # TestPyPI publish runs in the caller so PyPI Trusted Publishing matches the
  # OIDC job_workflow_ref against this repo's release.yml (reusable workflows
  # are not matched by PyPI's publisher config).
  publish-testpypi:
    needs: release
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pyvider-cty
    steps:
      - name: 📦 Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-artifacts
          path: dist
      - name: 📤 Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # Install from TestPyPI and assert the installed version matches the release tag.
  # Uses the helper scripts from ci-tooling/scripts/release/.
  verify-testpypi:
    needs: publish-testpypi
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout ci-tooling helpers
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: provide-io/ci-tooling
          ref: e593b16e043a725c3234e0e6b9e5a2a29829c071  # v0.4.2
          path: .ci-tooling
      - name: 🐍 Setup Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.11"
          enable-cache: false
      - name: 🔖 Resolve version
        id: ver
        env:
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: .ci-tooling/scripts/release/resolve-tag-version.sh >> "$GITHUB_OUTPUT"
      - name: ✅ Install from TestPyPI and verify
        run: |
          .ci-tooling/scripts/release/verify-testpypi.sh pyvider-cty "${{ steps.ver.outputs.version }}" "import pyvider.cty; v = pyvider.cty.__version__"

  # PyPI publish via trusted publisher bound to this repo's release.yml + env `pypi`.
  publish-pypi:
    needs: verify-testpypi
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/p/pyvider-cty
    steps:
      - name: 📦 Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-artifacts
          path: dist
      - name: 📤 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # release/v1
        with:
          skip-existing: true

  # Generate SBOM, sign artifacts, attach everything to the GH release.
  sign-and-upload:
    needs: [publish-pypi]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: 🐍 Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.11"
      - name: 📦 Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-artifacts
          path: dist
      # Describes the built wheel and its dependencies, installed into a fresh
      # venv. `uvx cyclonedx-py environment` on its own described the uvx tool
      # venv -- cyclonedx-bom and friends, not this package.
      - name: 🧾 Generate Python SBOM
        run: scripts/sbom_from_wheel.sh dist sbom-python.cdx.json
      - name: 🔏 Sigstore sign artifacts
        uses: sigstore/gh-action-sigstore-python@f514d46b907ebcd5bedc05145c03b69c1edd8b46  # v3.0.0
        with:
          inputs: dist/*.whl dist/*.tar.gz
      - name: ⬆️ Attach artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" dist/*.whl dist/*.tar.gz dist/*.sigstore.json sbom-python.cdx.json --repo "$GITHUB_REPOSITORY" --clobber
